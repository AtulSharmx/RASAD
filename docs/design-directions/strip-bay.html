<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASAD - Direction A: Strip Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Devanagari:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-contour@4"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="common.js"></script>
<style>
:root {
  --board: #dfe4dd; --board-2: #d2d8d0; --paper: #fffef9; --ink: #16212b; --ink-2: #3c4954; --rule: #b9c2bb;
  --road: #d39b1f; --foot: #8a5a2b; --heli: #1f5fa8; --drone: #5a3fa0;
  --urgent: #b8232b; --watch: #a35f00; --ok: #1d6f43; --focus: #1f5fa8;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 500 15px/1.35 Barlow, system-ui, sans-serif; color: var(--ink); background: var(--board);
  font-variant-numeric: tabular-nums; display: grid; grid-template-rows: 56px 1fr 40px; }
::selection { background: #ffd970; }

/* top rail */
header { display: flex; align-items: center; gap: 20px; padding: 0 16px 0 14px; background: var(--ink); color: #fff; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font: 700 26px/1 var(--cond); letter-spacing: .02em; }
.brand span { font: 600 17px/1 "Noto Sans Devanagari", sans-serif; color: #c9d3db; }
.sector { font: 600 17px var(--cond); color: #e8edf1; }
.sector small { font: 500 13px Barlow; color: #aab7c2; margin-left: 6px; }
.clock { margin-left: auto; display: flex; align-items: center; gap: 10px; font: 600 18px var(--cond); }
.seg { display: inline-flex; border: 1px solid #5d6b77; border-radius: 6px; overflow: hidden; }
.seg button { font: 600 14px Barlow; padding: 5px 12px; border: 0; background: transparent; color: #c9d3db; cursor: pointer; }
.seg button[aria-pressed=true] { background: #fff; color: var(--ink); }
.btn { font: 600 15px Barlow; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 6px; border: 0; cursor: pointer; }
.btn-primary { background: #ffd24a; color: var(--ink); }
.role { font: 600 14px Barlow; background: #24323e; color: #fff; border: 1px solid #5d6b77; border-radius: 6px; padding: 6px 10px; }

main { display: grid; grid-template-columns: 84px 1fr 452px; min-height: 0; }

/* nav rail */
nav { background: var(--board-2); border-right: 1px solid var(--rule); padding: 10px 6px; display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px; border-radius: 8px; color: var(--ink-2);
  text-decoration: none; font: 600 12px/1.15 Barlow; text-align: center; }
nav a svg { width: 22px; height: 22px; stroke-width: 2; }
nav a[aria-current=page] { background: var(--ink); color: #fff; }

/* map */
.mapwrap { position: relative; margin: 10px 0 10px 10px; border: 1px solid #8f9a92; border-radius: 4px; overflow: hidden; background: #f1f2ec; }
#map { position: absolute; inset: 0; background: #eef0ea; }
.leaflet-container { font: inherit; }
.maplabel { font: 700 14px var(--cond); color: var(--ink); white-space: nowrap; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
.maplabel small { font: 500 12px Barlow; color: var(--ink-2); }
.pass { font: italic 600 13px Barlow; color: #5b3b1c; text-shadow: 0 0 3px #fff, 0 0 3px #fff; white-space: nowrap; }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 500; background: rgba(255,254,249,.94); border: 1px solid var(--rule);
  border-radius: 4px; padding: 8px 10px; display: grid; grid-template-columns: auto auto; gap: 4px 14px; font: 500 13px Barlow; }
.legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 3px solid; }
.mapchips { position: absolute; right: 12px; top: 12px; z-index: 500; display: flex; gap: 6px; }

/* chips: provenance as plies */
.chip { font: 600 11.5px/1 Barlow; padding: 4px 7px; border-radius: 4px; cursor: help; white-space: nowrap; border: 1px solid var(--ink); }
.chip.real { background: var(--ink); color: #fff; }
.chip.sim { background: repeating-linear-gradient(135deg, #fff 0 4px, #e6eaee 4px 8px); color: var(--ink); border-style: dashed; }
.chip.ph { background: #ffe36e; color: var(--ink); border-color: #b49400; }

/* strip bay */
.bay { display: flex; flex-direction: column; min-height: 0; padding: 10px 12px 10px 10px; gap: 8px; }
.bay h2 { margin: 2px 2px 0; font: 700 22px var(--cond); display: flex; align-items: baseline; gap: 10px; }
.bay h2 em { font-style: normal; color: var(--urgent); }
.bay h2 small { margin-left: auto; font: 500 13px Barlow; color: var(--ink-2); }
.strips { display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.strip { display: grid; grid-template-columns: 58px 1fr; background: var(--paper); border: 1px solid #9aa59d; border-radius: 3px;
  box-shadow: 0 1px 2px rgba(22,33,43,.18); min-height: 0; }
.holder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #fff; font: 700 12px var(--cond); border-radius: 2px 0 0 2px; }
.holder svg { width: 24px; height: 24px; }
.cells { display: grid; grid-template-columns: 1.35fr 1fr 1fr; grid-template-rows: auto auto; }
.cell { padding: 6px 9px; border-right: 1px solid #d6dbd6; }
.cell:nth-child(3) { border-right: 0; }
.cell .k { font: 500 12px Barlow; color: var(--ink-2); display: block; }
.cell .v { font: 700 22px/1.05 var(--cond); }
.cell .v small { font: 600 14px var(--cond); color: var(--ink-2); }
.who .v { font-size: 21px; }
.who .k { font-size: 13px; color: var(--ink); font-weight: 600; }
.due .v { display: inline-block; padding: 0 6px; margin-left: -6px; border: 2px solid currentColor; border-radius: 3px; }
.urgent .due .v { color: var(--urgent); }
.passed .due .v { color: #fff; background: var(--urgent); border-color: var(--urgent); }
.why { grid-column: 1 / -1; border-top: 1px solid #d6dbd6; padding: 6px 9px 7px; font: 500 13.5px/1.3 Barlow; display: flex; gap: 8px; align-items: flex-start; }
.why p { margin: 0; flex: 1; }
.stocked { margin-top: 2px; border-top: 2px solid var(--rule); padding-top: 8px; }
.stocked h3 { margin: 0 2px 6px; font: 700 16px var(--cond); }
.stocked ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
.stocked li { background: var(--paper); border: 1px solid #b9c2bb; border-radius: 3px; padding: 4px 8px; font: 600 14px var(--cond); display: flex; justify-content: space-between; }
.stocked li span { color: var(--ok); }

/* bottom rail */
footer { display: flex; align-items: center; gap: 22px; padding: 0 16px; background: var(--board-2); border-top: 1px solid var(--rule); font: 500 14px Barlow; }
footer b { font: 700 15px var(--cond); }
footer .warn { color: var(--watch); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>RASAD</b><span>रसद</span></div>
  <div class="sector">Sector X <small>fictional</small></div>
  <div class="clock"><span id="clock">25 Oct 2026, 06:00</span>
    <div class="seg" role="group" aria-label="Mode"><button aria-pressed="true">Demo</button><button aria-pressed="false">Live</button></div>
  </div>
  <button class="btn btn-primary"><i data-lucide="presentation"></i>Guided demo</button>
  <select class="role" aria-label="Role"><option>Commander</option><option>Logistics Officer</option><option>Post QM</option></select>
</header>
<main>
  <nav aria-label="Screens">
    <a href="#" aria-current="page"><i data-lucide="map"></i>Dashboard</a>
    <a href="#"><i data-lucide="mountain-snow"></i>Posts</a>
    <a href="#"><i data-lucide="calendar-clock"></i>Point of no return</a>
    <a href="#"><i data-lucide="route"></i>Plan</a>
    <a href="#"><i data-lucide="plane"></i>Drones</a>
    <a href="#"><i data-lucide="git-compare-arrows"></i>What-if</a>
    <a href="#"><i data-lucide="database"></i>Sources</a>
    <a href="#"><i data-lucide="scroll-text"></i>Audit log</a>
  </nav>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="mapchips">
      <span class="chip real" title="Terrain: Copernicus DEM GLO-90. Roads and passes: OpenStreetMap. Cached on this machine.">Real data: terrain, roads</span>
      <span class="chip sim" title="Simulated: military data is classified; in deployment this comes from CICG via adapters">Simulated: posts, stock</span>
    </div>
    <div class="legend">
      <span><i style="border-color:#7a3b1e"></i>National highway</span><span><i style="border-color:#16212b"></i>Forward road</span>
      <span><i style="border-color:#16212b;border-top-style:dashed"></i>Jeep track</span><span><i style="border-color:#8a5a2b;border-top-style:dotted"></i>Mule track</span>
      <span><i style="border-color:#5a3fa0;border-top-style:dashed"></i>Drone leg</span><span><i style="border-color:#b8232b"></i>Closed</span>
    </div>
  </div>
  <section class="bay" aria-label="Action strips">
    <h2 id="bayhead"></h2>
    <div class="strips" id="strips"></div>
  </section>
</main>
<footer id="foot"></footer>
<script>
const MODE = { jeep: ['road', 'truck', 'JEEP'], truck: ['road', 'truck', 'TRUCK'], mule: ['foot', 'footprints', 'MULE'],
  porter: ['foot', 'footprints', 'PORTER'], helicopter: ['heli', 'plane', 'HELI'], drone: ['drone', 'send', 'DRONE'] };
(async () => {
  const d = await loadAll();
  const S = postSummaries(d);
  const risk = Object.values(S).filter((s) => ['passed', 'urgent'].includes(s.item.status)).sort((a, b) => RANK[a.item.status] - RANK[b.item.status] || a.item.days_left - b.item.days_left);
  const rest = Object.values(S).filter((s) => !risk.includes(s));
  document.getElementById('bayhead').innerHTML = `<em>${risk.length} posts at risk</em> Act before the road shuts <small>${rest.length} stocked</small>`;

  document.getElementById('strips').innerHTML = risk.map((s) => {
    const i = s.item, main = s.lines.slice().sort((a, b) => b.kg - a.kg)[0];
    const [m, icon, tag] = MODE[main?.mode] || MODE.helicopter;
    const passed = i.status === 'passed';
    const due = passed ? 'Air only' : (i.days_left === 0 ? 'Today' : day(i.last_safe_dispatch));
    const modes = [...new Set(s.lines.map((l) => l.mode))].join(' + ');
    const drone = s.lines.find((l) => l.mode === 'drone');
    const why = passed
      ? `Track closed by snow. ${drone ? `Drone from ${drone.from}: ${fmt(drone.trips)} sorties ${drone.when}, 15 kg each.` : 'Air only.'} Helicopter would cost ~${i.cost_multiple}× road.`
      : `Road open until ${day(i.closure_p20)} (80% confidence). Plan: ${modes}. Road ₹${fmt(i.road_inr_per_kg, 1)}/kg vs helicopter ₹${fmt(i.air_inr_per_kg)}/kg.`;
    return `<article class="strip ${i.status}">
      <div class="holder" style="background:var(--${m})"><i data-lucide="${icon}"></i>${tag}</div>
      <div class="cells">
        <div class="cell who"><span class="v">${i.post_name.replace('Post ', '')} <small>${fmt(s.node.alt_m)} m</small></span><span class="k">${i.label}</span></div>
        <div class="cell"><span class="k">Lasts</span><span class="v">${s.cover ? s.cover.days : '–'} d <small>${s.cover ? s.cover.days_low + '–' + s.cover.days_high : ''}</small></span></div>
        <div class="cell due"><span class="k">${passed ? 'Ground route' : 'Last road day · 80%'}</span><span class="v">${due}</span></div>
        <div class="why"><p>${why}</p><span class="chip sim" title="Simulated: military data is classified; in deployment this comes from CICG via adapters">Sim</span><span class="chip ph" title="${i.cost_basis}">PLACEHOLDER</span></div>
      </div></article>`;
  }).join('') + `<div class="stocked"><h3>Stocked until the routes reopen</h3><ul>${rest.map((s) =>
    `<li>${s.node.name.replace('Post ', '')} <span>${s.item.status === 'stocked' ? 'to ' + day(s.item.reopen_p80) : s.item.status}</span></li>`).join('')}</ul></div>`;

  const ax = d.pnr.axes, src = d.sources, warn = src.filter((s) => s.health !== 'ok');
  document.getElementById('foot').innerHTML =
    `<span><b>${ax[1].name.replace(' (real)', '')}</b> closes ${day(ax[1].closure_p20)}–${day(ax[1].closure_p80)}</span>
     <span><b>${ax[0].name.replace(' (real)', '')}</b> closes ${day(ax[0].closure_p20)}–${day(ax[0].closure_p80)}</span>
     <span style="margin-left:auto"><b>${src.length} data sources</b> · ${src.length - warn.length} healthy, <span class="warn">${warn.length} warning</span></span>
     <span class="chip real">Runs fully on-premise</span>`;

  // map: pale relief, real roads, fictional network, status squares
  const { map, g } = baseMap('map', d);
  reliefOverlay(g, (e) => { const t = Math.min(1, Math.max(0, (e - 2900) / 2900)); return [238 - 28 * t, 240 - 30 * t, 228 - 24 * t]; }, 0.55).addTo(map);
  contourLayer(g, 500, (f) => ({ color: '#9b8a6e', weight: f.properties.value % 1000 ? 0.5 : 1, opacity: .7 })).addTo(map);
  d.sector.osm.filter((f) => f.kind === 'road').forEach((f) => L.polyline(f.geometry, { color: '#7a3b1e', weight: 3.5, opacity: .9 }).addTo(map));
  const status = Object.fromEntries(d.sector.roads.map((r) => [r.segment, r.status]));
  forwardLinks(d).forEach((l) => {
    const closed = status[l.id] === 'closed';
    const st = { road: { color: '#16212b', weight: 3 }, jeep_track: { color: '#16212b', weight: 2.5, dashArray: '7 5' }, mule_track: { color: '#8a5a2b', weight: 3, dashArray: '2 5' } }[l.mode];
    L.polyline(routeCoords(d, l), { ...st, ...(closed ? { color: '#b8232b' } : {}), lineCap: 'round' }).addTo(map);
  });
  d.plan.lines.filter((l) => l.mode === 'drone').forEach((l) => {
    const b = d.sector.nodes.find((n) => n.name === l.from), p = d.sector.nodes.find((n) => n.id === l.post);
    L.polyline([[b.lat, b.lon], [p.lat, p.lon]], { color: '#5a3fa0', weight: 3, dashArray: '10 6' }).addTo(map);
  });
  d.sector.passes.forEach((p) => L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '', html: `<div class="pass">▲ ${p.name} ${fmt(p.alt_m)} m</div>`, iconAnchor: [6, 8] }) }).addTo(map));
  const colour = { passed: '#b8232b', urgent: '#b8232b', watch: '#a35f00', margin: '#16212b', stocked: '#1d6f43' };
  d.sector.nodes.forEach((n) => {
    if (n.kind === 'post') {
      const st = S[n.id].item.status, sz = RANK[st] < 2 ? 20 : 14;
      L.marker([n.lat, n.lon], { icon: L.divIcon({ className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
        html: `<div style="width:${sz}px;height:${sz}px;background:${colour[st]};border:2px solid #fff;outline:1.5px solid #16212b"></div>` }) }).addTo(map);
      L.marker([n.lat, n.lon], { icon: L.divIcon({ className: '', iconAnchor: [-14, 10], html: `<div class="maplabel">${n.name.replace('Post ', '')} <small>${fmt(n.alt_m)} m</small></div>` }) }).addTo(map);
    } else if (['roadhead', 'node', 'depot'].includes(n.kind)) {
      L.circleMarker([n.lat, n.lon], { radius: 6, color: '#16212b', weight: 2, fillColor: '#fff', fillOpacity: 1 }).addTo(map);
      L.marker([n.lat, n.lon], { icon: L.divIcon({ className: '', iconAnchor: [-10, 9], html: `<div class="maplabel">${n.name}</div>` }) }).addTo(map);
    }
  });
  lucide.createIcons();
})();
</script>
</body>
</html>
